<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Whitewater Warriors</title>
    <meta name="description"
      content="Discover exciting and safe whitewater rafting adventures with Whitewater Warriors. Experience teamwork, fun, and unforgettable river journeys">
    <meta name="author" content="Amenaghawon Imuetinyan Favour">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header><img src="images/downriver.jpg" alt="a water rafting logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>

        </nav>
    </header>
    <main>
        <h1>Whitewater Warriors</h1>
        <p>23 George street</p>
        <p>Lagos Island</p>
        <p>+234 813 864 2336</p>
        <p>info@White Warriors</p>
        <div class="container">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d33889.32742825202!2d3.370203182748723!3d6.623559097444304!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sng!4v1775135919570!5m2!1sen!2sng"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
            <form>

                <div class="form-row">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter Your Name">
                </div>
                <div class="form-row">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter Your Email">
                </div>

                <div class="form-row">

                    <div class="form-labels">
                        <label>Purpose</label>
                        <label>Message</label>
                    </div>


                    <div class="radio-group">
                        <label><input type="radio" id="general" name="purpose"> General
                            Inquiry</label>
                        <label><input type="radio" id="reservation" name="purpose"> Reservation
                            Question</label>
                        <label><input type="radio" id="suggestion" name="purpose"> Website
                            Suggestion</label>
                    </div>
                </div>
                <div class="form-row1">
                    <label for="message">Message</label>
                    <textarea name="message" id="message" rows="4"
                      placeholder="Type here"></textarea>
                </div>
                <div class="form-row2">
                    <label>
                        <input type="checkbox" id="subscription" name="subscription">
                        Please subscribe me to the monthly newsletter
                    </label>
                </div>
                <button type="submit">Get in Touch!</button>
            </form>
        </div>
        <div class="hero">
            <img src="images/rafting65.jpg" alt="whitewater rafting adventure hero image">
        </div>
    </main>
    <footer>
        <p>©️2026💦🤽Whitewater Warriors💦🤽 Amenaghawon Imuetinyan Favour </p>
        <nav class="socialmedia">
            <a href="https://whatsapp.com">
                <img src="images/whatsapp.svg" alt="whatsapp icon" width="100">
            </a>
            <a href="https://youtube.com">
                <img src="images/youtube.svg" alt="youtube icon" width="100">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="instagram icon" width="100">
            </a>
        </nav>
    </footer>
</body>

</html>
